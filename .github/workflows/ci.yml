name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install a subset of engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-tools p7zip-full zstd ghostscript poppler-utils file
      - name: install cirax
        run: uv sync
      - name: doctor
        run: uv run cirax doctor
      - name: conversion checks
        run: |
          set -e
          T=$(mktemp -d); cd "$T"
          CIRAX="$GITHUB_WORKSPACE/.venv/bin/cirax"
          printf 'hello cirax\n' > doc.txt
          echo "[1] txt -> zst"
          $CIRAX convert -q doc.txt -t zst
          file -b doc.zst | grep -qiE "zstandard|zstd"
          echo "[2] zip -> 7z"
          7z a -bso0 archive.zip doc.txt
          $CIRAX convert -q archive.zip -t 7z
          file -b archive.7z | grep -qi "7-zip"
          echo "[3] png -> webp"
          python3 - <<'PY'
          import base64, pathlib
          # 1x1 transparent PNG
          png = base64.b64decode(
            "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4"
            "nGNgYGBgAAAABQABh6FO1AAAAABJRU5ErkJggg==")
          pathlib.Path("dot.png").write_bytes(png)
          PY
          $CIRAX convert -q dot.png -t webp
          file -b dot.webp | grep -qiE "web.?p"
          echo "[4] ps -> pdf -> txt"
          printf '%%!PS\n/Helvetica findfont 20 scalefont setfont 72 700 moveto (Hello Cirax) show showpage\n' > doc.ps
          $CIRAX convert -q doc.ps readme.pdf
          $CIRAX convert -q readme.pdf -t txt
          grep -qi cirax readme.txt
          echo "ci conversions ok"

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install a subset of engines
        shell: pwsh
        run: |
          choco install -y --no-progress ffmpeg imagemagick ghostscript poppler 7zip pandoc
      - name: install cirax
        run: uv sync
      - name: doctor
        run: uv run cirax doctor
      - name: conversion checks
        run: |
          set -e
          T=$(mktemp -d); cd "$T"
          CIRAX="$GITHUB_WORKSPACE/.venv/Scripts/cirax"
          printf 'hello cirax\n' > doc.txt
          echo "[1] png -> pdf (imagemagick)"
          python - <<'PY'
          import struct, zlib, pathlib
          def chunk(t, data):
              c = t + data
              return struct.pack(">I", len(data)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\xff\xff"))
                 + chunk(b"IEND", b""))
          pathlib.Path("dot.png").write_bytes(png)
          PY
          "$CIRAX" convert -q dot.png -t pdf
          test -s dot.pdf
          echo "[2] zip -> 7z"
          7z a -bso0 archive.zip doc.txt
          "$CIRAX" convert -q archive.zip -t 7z
          test -s archive.7z
          echo "[3] webp -> png (imagemagick)"
          magick dot.png src.webp
          "$CIRAX" convert -q src.webp out.png
          test -s out.png
          python -c "import pathlib; b = pathlib.Path('out.png').read_bytes(); assert b[:8] == b'\x89PNG\r\n\x1a\n', 'not a png'"
          echo "[4] ps -> pdf -> txt"
          printf '%%!PS\n/Helvetica findfont 20 scalefont setfont 72 700 moveto (Hello Cirax) show showpage\n' > doc.ps
          "$CIRAX" convert -q doc.ps readme.pdf
          test -s readme.pdf
          "$CIRAX" convert -q readme.pdf -t txt
          grep -qi cirax readme.txt
          echo "windows conversions ok"
