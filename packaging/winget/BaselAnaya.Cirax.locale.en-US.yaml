ShortDescription: Universal local conversion hub — every format to every format, fully offline
Description: |-
  Cirax turns your machine into a conversion hub. One command reaches every
  format — it routes between the best local engines (FFmpeg, libvips,
  ImageMagick, LibreOffice, Pandoc, Calibre, 7-Zip, qpdf, ...) and chains
  them automatically. Files never leave your disk.
