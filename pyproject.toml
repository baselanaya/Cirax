[project]
name = "cirax"
version = "0.8.1"
description = "Universal local conversion hub — every format to every format, fully offline on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cirax" }]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
desktop = ["pyside6>=6.6", "pyinstaller>=6.0"]

[project.scripts]
cirax = "cirax.cli:main"

[dependency-groups]
desktop = ["pyside6>=6.6", "pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirax"]
