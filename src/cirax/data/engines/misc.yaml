# Misc domains: VM disks, 3D, GIS, fonts, and local-AI stubs.

engines:
  - engine: qemu-img
    binary: qemu-img
    package: qemu-img
    install_macos: "brew install qemu"
    install_windows: "scoop install qemu"
    description: VM disk image converter (qcow2/vdi/vmdk/vhd/vhdx/raw)
    categories: [disk]
    probe: {args: [--version], version_regex: 'qemu-img version ([^\s]+)'}
    routes:
      - from: [application/x-qemu-disk, application/x-vmdk, application/x-vdi,
               application/x-vhd, application/x-vhdx, application/x-raw-disk]
        to: [application/x-qemu-disk, application/x-vmdk, application/x-vdi,
             application/x-vhd, application/x-vhdx, application/x-raw-disk]
        lossless: true
        priority: 95
        command: "qemu-img convert -O {outfmt} {input} {output}"
        vars:
          outfmt:
            application/x-qemu-disk: qcow2
            application/x-vmdk: vmdk
            application/x-vdi: vdi
            application/x-vhd: vpc
            application/x-vhdx: vhdx
            application/x-raw-disk: raw

  - engine: assimp
    binary: assimp
    package: assimp
    description: 3D model format net (50+ mesh formats)
    categories: [model3d]
    probe: {args: [version], version_regex: 'Open Asset Import Library.*?\s([^\s]+)'}
    routes:
      - from: [model/obj, model/ply, model/stl, model/vnd.collada+xml,
               model/3ds, model/x3d, model/gltf+json, model/gltf-binary,
               model/fbx]
        to: [model/obj, model/ply, model/stl, model/vnd.collada+xml,
             model/x3d, model/gltf+json, model/gltf-binary, model/fbx]
        lossless: false
        priority: 70
        command: "assimp export {input} {output}"

  - engine: blender
    binary: blender
    package: blender
    description: High-fidelity 3D hub — .blend to glTF/FBX/OBJ/STL/PLY via headless export
    categories: [model3d]
    probe:
      args: [--version]
      version_regex: 'Blender ([^\s]+)'
    routes:
      - from: [model/x-blend]
        to: [model/gltf-binary, model/gltf+json, model/fbx, model/obj,
             model/stl, model/ply]
        lossless: false
        priority: 95
        note: scene is exported with default settings; assimp covers the rest
        command: >-
          blender --background {input} --python {data_dir}/blender/cirax_export.py
          -- {outfmt} {output}
        vars:
          outfmt:
            model/gltf-binary: GLB
            model/gltf+json: GLTF
            model/fbx: FBX
            model/obj: OBJ
            model/stl: STL
            model/ply: PLY

  - engine: fonttools
    binary: fonttools
    package: python-fonttools
    install_macos: "pip install fonttools"
    install_windows: "pip install fonttools"
    description: Font converter — TTF/OTF/WOFF/WOFF2
    categories: [font]
    note: version probing via --version prints a traceback; detection only
    probe: {}
    routes:
      - from: [font/ttf, font/otf]
        to: [font/woff2]
        lossless: true
        priority: 95
        command: "fonttools ttLib.woff2 compress -o {output} {input}"
      - from: [font/woff2]
        to: [font/ttf, font/otf]
        lossless: true
        priority: 95
        command: "fonttools ttLib.woff2 decompress -o {output} {input}"
      - from: [font/ttf, font/otf]
        to: [font/woff]
        lossless: true
        priority: 90
        command: "fonttools ttLib.woff compress -o {output} {input}"
      - from: [font/woff, font/woff2]
        to: [font/ttf, font/otf]
        lossless: true
        priority: 90
        command: "fonttools ttLib.woff decompress -o {output} {input}"

  - engine: ogr2ogr
    binary: ogr2ogr
    package: gdal
    description: Geospatial vector converter (GeoJSON/KML/GPKG/...)
    categories: [gis]
    probe: {args: [--version], version_regex: 'GDAL ([^\s]+)'}
    routes:
      - from: [application/geo+json, application/vnd.google-earth.kml+xml,
               application/geopackage+sqlite3]
        to: [application/geo+json, application/vnd.google-earth.kml+xml,
             application/geopackage+sqlite3]
        lossless: false
        priority: 95
        command: "ogr2ogr -f {ofmt} {output} {input}"
        vars:
          ofmt:
            application/geo+json: GeoJSON
            application/vnd.google-earth.kml+xml: KML
            application/geopackage+sqlite3: GPKG

  - engine: piper
    binary: piper
    install_linux: >-
      piper: get the binary from github.com/rhasspy/piper/releases and a voice
      from huggingface.co/rhasspy/piper-voices into
      ~/.local/state/cirax/models/piper/ (see docs/ENGINES.md)
    description: Offline text-to-speech (TXT to WAV) via the rhasspy piper CLI
    categories: [audio]
    setup_hint: >-
      download a voice model into ~/.local/state/cirax/models/piper/
      (e.g. en_US-lessac-medium.onnx + .onnx.json from
      huggingface.co/rhasspy/piper-voices) — then convert any .txt to .wav
    probe: {args: [--help], version_regex: 'piper'}
    routes:
      - from: [text/plain, text/markdown]
        to: [audio/x-wav]
        lossless: false
        priority: 80
        stdin_from: input
        output_from: none
        note: uses the en_US-lessac voice under {models_dir}/piper/; drop any
              piper voice (.onnx + .onnx.json) there and edit the spec to use it
        command: "piper -m {models_dir}/piper/en_US-lessac-medium.onnx -f {output} -q"
